workflows:
  ios-workflow:
    name: iOS Build & Publish
    integrations:
      app_store_connect: Codemagic
    instance_type: mac_mini_m1
    max_build_duration: 60
    environment:
      node: latest
      xcode: latest
      cocoapods: default
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.zolamoneytrans.web
    scripts:
      - name: Install dependencies
        script: npm install
      - name: Build Web Assets (macOS compat)
        script: |
          rm -rf www
          mkdir -p www
          cp *.html manifest.json sw.js sitemap.xml robots.txt www/ 2>/dev/null || true
          cp -R css js icons assets www/ 2>/dev/null || true
      - name: Sync Capacitor (iOS)
        script: npx cap sync ios
      - name: Disable Xcode User Script Sandboxing
        script: |
          sed -i '' 's/buildSettings = {/buildSettings = {\n\t\t\t\tENABLE_USER_SCRIPT_SANDBOXING = NO;/g' ios/App/App.xcodeproj/project.pbxproj

      - name: Set up code signing settings on Xcode project
        script: xcode-project use-profiles
      - name: Build IPA
        script: |
          xcode-project build-ipa \
            --workspace "ios/App/App.xcworkspace" \
            --scheme "App"
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
