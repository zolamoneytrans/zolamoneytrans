<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Paiement CB Réussi - Zola Money Trans</title>
  <link rel="stylesheet" href="index.css">
  <style>
    body {
      background: #0B0E1B;
      color: #F8FAFC;
      font-family: 'Inter', system-ui, -apple-system, sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      margin: 0;
    }
    .success-card {
      background: #111528;
      border: 1px solid rgba(16, 185, 129, 0.4);
      border-radius: 24px;
      max-width: 480px;
      width: 100%;
      padding: 36px 28px;
      text-align: center;
      box-shadow: 0 25px 60px rgba(0,0,0,0.85);
    }
    .icon-wrapper {
      width: 80px;
      height: 80px;
      border-radius: 50%;
      background: rgba(16, 185, 129, 0.15);
      border: 2px solid #10B981;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 20px;
    }
    .status-msg {
      font-size: 0.85rem;
      color: #60A5FA;
      margin-top: 10px;
      min-height: 20px;
    }
  </style>
</head>
<body>
  <div class="success-card">
    <div class="icon-wrapper">
      <svg xmlns="http://www.w3.org/2000/svg" width="42" height="42" viewBox="0 0 24 24" fill="none" stroke="#10B981" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"></polyline></svg>
    </div>
    <h1 style="color: #FFF; font-size: 1.6rem; font-weight: 800; margin-bottom: 12px;">Paiement CB Confirmé !</h1>
    <p style="color: #94A3B8; font-size: 0.92rem; line-height: 1.6; margin-bottom: 16px;">
      Votre transaction par carte bancaire a été validée avec succès après vérification 3D-Secure (OTP).<br><br>
      ⚡ Le versement (PayOut) vers le portefeuille Mobile Money de l'Agent <strong style="color:#60A5FA;">Zola</strong> a été déclenché.
    </p>
    <div id="payoutStatus" class="status-msg">⏳ Vérification et transfert en cours...</div>
    <div style="background: rgba(30, 41, 59, 0.6); padding: 14px; border-radius: 12px; font-family: monospace; font-size: 0.85rem; color: #FCD34D; margin: 20px 0 28px; border: 1px dashed rgba(252, 211, 77, 0.3);">
      RÉFÉRENCE : <span id="refDisplay">CB_CONFIRMED</span>
    </div>
    <button id="btnFinish" style="background: linear-gradient(135deg, #10B981, #059669); color: #FFF; border: none; padding: 14px 28px; border-radius: 12px; font-weight: 700; font-size: 0.95rem; cursor: pointer; width: 100%;">
      ✔ Terminé (Retour à l'accueil)
    </button>
  </div>
  <script>
    const params = new URLSearchParams(window.location.search);
    const ref = params.get('ref') || 'VALIDÉ';
    document.getElementById('refDisplay').innerText = ref;

    // Déclenchement / vérification automatique du PayOut Agent à l'arrivée sur la page de confirmation
    async function triggerPayout() {
      if (!ref || ref === 'VALIDÉ') return;
      try {
        const res = await fetch(`https://us-central1-zolamoneytransmarchand.cloudfunctions.net/verifyAndTriggerCardPayout?ref=${encodeURIComponent(ref)}`);
        const data = await res.json();
        const statusDiv = document.getElementById('payoutStatus');
        if (data && data.success) {
          statusDiv.innerText = "✅ Versement Agent effectué avec succès !";
          statusDiv.style.color = "#10B981";
        } else {
          statusDiv.innerText = "⚡ Transaction confirmée. Versement en traitement.";
        }
      } catch (err) {
        console.warn("Trigger payout warning:", err);
      }
    }
    triggerPayout();

    document.getElementById('btnFinish').addEventListener('click', () => {
      try {
        if (window.opener) {
          window.close();
          return;
        }
      } catch(e) {}
      window.location.href = 'index.html';
    });
  </script>
</body>
</html>
